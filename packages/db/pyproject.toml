[project]
name = "newsdock-db"
version = "0.0.0"
description = "newsdock shared package: db"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy[asyncio]>=2.1",
    "psycopg[binary]>=3.3",
    "pydantic-settings>=2.15",
]

[project.optional-dependencies]
migrate = ["alembic>=1.20"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/newsdock_db"]
