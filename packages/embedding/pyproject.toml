[project]
name = "newsdock-embedding"
version = "0.0.0"
description = "newsdock shared package: Ollama embedding client, text recipe and vector validation"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/newsdock_embedding"]
