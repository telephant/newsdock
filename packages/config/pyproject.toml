[project]
name = "newsdock-config"
version = "0.0.0"
description = "newsdock shared package: layered configuration (env > YAML file > defaults)"
requires-python = ">=3.12"
dependencies = [
    "pydantic-settings>=2.15",
    "pyyaml>=6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/newsdock_config"]
