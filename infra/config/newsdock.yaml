# newsdock configuration (ADR-0013). Committed on purpose: NO secrets here.
#   Order of precedence: environment variables > this file > code defaults.
#   `common:` is inherited by every service; a service section may override any key.
#   Nested keys flatten with "_" to the setting name: kafka.topics.clean ->
#   kafka_topics_clean, env NEWSDOCK_KAFKA_TOPICS_CLEAN.
#   Secrets (DATABASE_URL, passwords) stay in .env / the environment; the loader
#   rejects secret-looking keys in this file.
# Every value below equals the built-in default, so an empty file changes nothing.

common:
  log_level: INFO
  heartbeat_file: /tmp/healthy
  kafka:
    bootstrap_servers: 127.0.0.1:29092   # compose overrides with kafka:9092 (env)
    topics:
      raw: gkg.raw
      clean: gkg.clean
      dlq: gkg.dlq
      events_clean: events.clean      # events-mentions (ADR-0032); raw and dlq are shared
      mentions_clean: mentions.clean
  # semantic-search (ADR-0024): shared by the embedder and the API, which must agree.
  # A model mismatch hides rows from vector search until re-embedded, it never mixes them.
  embedding_model: nomic-embed-text
  embedding_dimension: 768               # fixed by migration 0008 (vector(768))
  embedding_document_prefix: "search_document: "
  embedding_query_prefix: "search_query: "
  embedding_ollama_url: http://127.0.0.1:11434   # compose sets OLLAMA_URL (host.docker.internal)

ingester:
  gdelt_base_url: http://data.gdeltproject.org/gdeltv2
  gdelt_index_path: /lastupdate.txt
  poll_interval_seconds: 900     # GDELT rule: never below 900, enforced in code
  http_timeout_seconds: 60
  max_attempts: 4
  fetch_events: true             # events-mentions (ADR-0032): also fetch the Events file
  fetch_mentions: true           # ... and the Mentions file; both false = GKG only

processor: {}
sink: {}
# body-extraction (ADR-0035, ADR-0036): the only component that fetches the open web
extractor:
  concurrency: 16                  # pages fetched at once, never two for one site
  per_host_delay_seconds: 5        # wait between two requests to one site (or its Crawl-delay)
  max_crawl_delay_seconds: 30      # a site asking for more is skipped as blocked_robots
  max_bytes: 2000000               # response size cap
  max_redirects: 3
  max_attempts: 3                  # for 429, 5xx, timeouts
  retry_backoff_minutes: "5,30"
  min_chars: 200                   # shorter extracted text is no_text
  text_cap_chars: 20000            # decided: text kept per article
  passage_chars: 1000              # about one passage per 1,000 characters
  retention_days: 7                # keep equal to sink.retention_days
  backfill_hours: 6                # first run only: articles of the last hours
api:
  semantic_candidates: 50             # hits taken from each search leg before fusing
  semantic_rrf_k: 60                  # reciprocal-rank constant: score = 1 / (k + rank)
  semantic_query_max_length: 500      # characters of a semantic_search query
  semantic_ef_search: 100             # HNSW candidate list size per query
  semantic_ollama_timeout_seconds: 10 # embedding the query; then vector mode errors
  semantic_default_scope: titles      # what semantic_search searches without a scope: titles | body | all
  semantic_passage_candidates: 150    # passages taken from each text leg before folding to articles
  events_per_article: 20        # most events an article returns with include=events (ADR-0033)
  auth_required: true           # MCP needs an agent API key (ADR-0016); false = anonymous
  rate_limit_per_minute: 600     # per agent; anonymous traffic shares one bucket; 0 = off
  subscriptions_max_per_agent: 20     # saved filters one agent may hold (409 above)
  subscription_text_max_length: 200   # max characters of a filter value
  sse_max_streams_per_agent: 5        # concurrent SSE streams per agent (429 above)
  sse_keepalive_seconds: 15           # ': ping' interval; also the revoked-key re-check
  sse_fallback_poll_seconds: 30       # re-query even without a NOTIFY (listener outage)
  live_max_streams_per_user: 3        # concurrent live-feed streams per user (429 above)
  auth_signup_open: true              # false closes self-sign-up (ADR-0020, spec D-3)
  auth_min_pw_length: 10
  auth_session_idle_hours: 12         # a session unused this long ends
  auth_session_absolute_days: 7       # and no session outlives this
  auth_login_max_failures: 5          # wrong passwords per account inside the window (429 above); 0 = off
  auth_login_window_minutes: 15
  auth_cookie_secure: false           # set true when served over HTTPS
  auth_cookie_name: newsdock_session
  auth_signup_max_per_address: 5      # counted sign-ups per client address per window (429 above); 0 = off
  auth_signup_max_total: 50           # counted sign-ups from all addresses per window (429 above); 0 = off
  auth_signup_window_minutes: 60      # length of both sign-up windows
  agents_max_per_user: 10             # agents one non-owner user may own (409 above); 0 = off
  smtp_host: ""                       # empty = password reset by email is off (forgot-password)
  smtp_port: 587
  smtp_security: starttls             # starttls | ssl | none (none: loopback hosts only)
  smtp_user: ""                       # empty = no login (a relay); the password is env only
  mail_from: ""                       # sender address of the reset mail
  smtp_timeout_seconds: 10
  auth_reset_code_minutes: 15         # how long a reset code works
  auth_reset_max_attempts: 5          # wrong codes before the code is dead
  auth_reset_max_per_email: 3         # code requests per mailbox per window (silent above)
  auth_reset_max_per_address: 20      # code requests per client address per window (429 above)
  auth_reset_max_tries_per_address: 20  # code submissions per client address per window (429 above)
  auth_reset_window_minutes: 60
  cors_allow_cookies: true        # the web UI sends the session cookie (ADR-0021)
  cors_allow_methods: GET,POST,PATCH,DELETE
  cors_allow_headers: Content-Type,Last-Event-ID   # explicit: no wildcard with cookies
agent: {}
embedder:
  batch_size: 32                  # titles per Ollama request
  passage_batch_size: 32          # body passages per Ollama request
  poll_interval_seconds: 10       # pause when nothing is left to embed
  ollama_timeout_seconds: 60
  backoff_seconds: 5              # first retry delay while Ollama or the database is down
  backoff_max_seconds: 60         # the delay doubles up to this
  skip_after_failures: 3          # a title whose vector keeps being rejected is skipped
  skip_table_max_entries: 1000
web:                              # read at web server start (ADR-0014); env NEWSDOCK_WEB_* wins
  api_base_url: http://127.0.0.1:8000   # what the BROWSER calls (the host-published API)
  poll_ms: 60000
  # page_size: 20                   # unset: the API's own default applies
  session_cookie: newsdock_session  # must equal api.auth_cookie_name: the login gate looks for it
  login_required: true              # false only with api.auth_required: false (open dev mode)
