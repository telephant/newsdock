name: newsdock

services:
  kafka:
    image: apache/kafka:4.2.2
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://127.0.0.1:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    ports:
      - "127.0.0.1:29092:29092"
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s

  postgres:
    image: pgvector/pgvector:0.8.7-pg16-trixie
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?copy .env.example to .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?copy .env.example to .env}
      POSTGRES_DB: ${POSTGRES_DB:?copy .env.example to .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  topics:
    image: apache/kafka:4.2.2
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"
    volumes:
      - ./kafka/create-topics.sh:/create-topics.sh:ro
    networks: [data]
    entrypoint: ["/bin/bash", "/create-topics.sh"]

  migrate:
    build:
      context: ..
      dockerfile: infra/migrations/Dockerfile
    image: newsdock-migrate:dev
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:?copy .env.example to .env}:${POSTGRES_PASSWORD:?copy .env.example to .env}@postgres:5432/${POSTGRES_DB:?copy .env.example to .env}
    networks: [data]
    restart: "no"

  ingester:
    build:
      context: ..
      dockerfile: apps/ingester/Dockerfile
    image: newsdock-ingester:dev
    profiles: [apps]
    restart: unless-stopped
    networks: [data]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:?copy .env.example to .env}:${POSTGRES_PASSWORD:?copy .env.example to .env}@postgres:5432/${POSTGRES_DB:?copy .env.example to .env}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      kafka: {condition: service_healthy}
      postgres: {condition: service_healthy}
      topics: {condition: service_completed_successfully}
      migrate: {condition: service_completed_successfully}
    healthcheck:  # heartbeat file younger than ~1.3x the 900 s poll loop (R-4)
      test: ["CMD-SHELL", "test -n \"$$(find /tmp/healthy -mmin -20)\""]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 120s
  processor:
    build:
      context: ..
      dockerfile: apps/processor/Dockerfile
    image: newsdock-processor:dev
    profiles: [apps]
    restart: unless-stopped
    networks: [data]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      kafka: {condition: service_healthy}
      topics: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD-SHELL", "test -n \"$$(find /tmp/healthy -mmin -2)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
  sink:
    build:
      context: ..
      dockerfile: apps/sink/Dockerfile
    image: newsdock-sink:dev
    profiles: [apps]
    restart: unless-stopped
    networks: [data]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:?copy .env.example to .env}:${POSTGRES_PASSWORD:?copy .env.example to .env}@postgres:5432/${POSTGRES_DB:?copy .env.example to .env}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      kafka: {condition: service_healthy}
      postgres: {condition: service_healthy}
      topics: {condition: service_completed_successfully}
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD-SHELL", "test -n \"$$(find /tmp/healthy -mmin -2)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    image: newsdock-api:dev
    profiles: [apps]
    restart: unless-stopped
    networks: [data, agent]  # the only bridge between the two (AC-13)
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:?copy .env.example to .env}:${POSTGRES_PASSWORD:?copy .env.example to .env}@postgres:5432/${POSTGRES_DB:?copy .env.example to .env}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      postgres: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/health', timeout=3).status==200 else 1)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
  agent:
    build:
      context: ..
      dockerfile: apps/agent/Dockerfile
    image: newsdock-agent:dev
    profiles: [apps]
    restart: unless-stopped
    networks: [agent]  # no route to postgres or kafka (AC-13)
    environment:  # the agent's whole configuration surface (TC-35)
      MCP_URL: http://api:8000/mcp
      OLLAMA_URL: http://host.docker.internal:11434
    volumes:
      - agent_state:/data
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "test -n \"$$(find /tmp/healthy -mmin -2)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    image: newsdock-web:dev
    profiles: [apps]
    restart: unless-stopped
    networks: [agent]
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

networks:
  data: {}
  agent: {}

volumes:
  pgdata:
  agent_state:
