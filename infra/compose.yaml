name: newsdock

# Shared fragments (compose extension fields).
x-config-file: &config-file
  NEWSDOCK_CONFIG_FILE: /etc/newsdock/newsdock.yaml   # ADR-0013; no secrets inside
x-config-volume: &config-volume ./config:/etc/newsdock:ro
x-db-env: &db-env
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:?copy .env.example to .env}:${POSTGRES_PASSWORD:?copy .env.example to .env}@postgres:5432/${POSTGRES_DB:?copy .env.example to .env}

services:
  kafka:
    image: apache/kafka:4.2.2
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://127.0.0.1:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    ports:
      - "127.0.0.1:29092:29092"
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s

  postgres:
    image: pgvector/pgvector:0.8.7-pg16-trixie
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?copy .env.example to .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?copy .env.example to .env}
      POSTGRES_DB: ${POSTGRES_DB:?copy .env.example to .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  topics:  # one-shot Python job (ADR-0015); same image as the processor
    build:
      context: ..
      dockerfile: apps/processor/Dockerfile
    image: newsdock-processor:dev
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"
    environment:
      <<: *config-file
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    volumes:
      - *config-volume
    networks: [data]
    command: ["python", "-m", "newsdock_processor.adapters.topics"]

  migrate:
    build:
      context: ..
      dockerfile: infra/migrations/Dockerfile
    image: newsdock-migrate:dev
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: [*db-env, *config-file]
    volumes:
      - *config-volume
    networks: [data]
    restart: "no"

  ingester:
    build:
      context: ..
      dockerfile: apps/ingester/Dockerfile
    image: newsdock-ingester:dev
    profiles: [apps]
    restart: unless-stopped
    networks: [data]
    environment:
      <<: [*db-env, *config-file]
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    volumes:
      - *config-volume
    depends_on:
      kafka: {condition: service_healthy}
      postgres: {condition: service_healthy}
      topics: {condition: service_completed_successfully}
      migrate: {condition: service_completed_successfully}
    healthcheck:  # heartbeat age vs the max age the worker wrote itself (ADR-0015)
      test: ["CMD", "python", "-m", "newsdock_ingester.adapters.healthcheck"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 120s
  processor:
    build:
      context: ..
      dockerfile: apps/processor/Dockerfile
    image: newsdock-processor:dev
    profiles: [apps]
    restart: unless-stopped
    networks: [data]
    environment:
      <<: *config-file
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    volumes:
      - *config-volume
    depends_on:
      kafka: {condition: service_healthy}
      topics: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "python", "-m", "newsdock_processor.adapters.healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
  sink:
    build:
      context: ..
      dockerfile: apps/sink/Dockerfile
    image: newsdock-sink:dev
    profiles: [apps]
    restart: unless-stopped
    networks: [data]
    environment:
      <<: [*db-env, *config-file]
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    volumes:
      - *config-volume
    depends_on:
      kafka: {condition: service_healthy}
      postgres: {condition: service_healthy}
      topics: {condition: service_completed_successfully}
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "python", "-m", "newsdock_sink.adapters.healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    image: newsdock-api:dev
    profiles: [apps]
    restart: unless-stopped
    networks: [data, agent]  # the only bridge between the two (AC-13)
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"  # container port fixed; host port from .env
    environment:
      <<: [*db-env, *config-file]
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      NEWSDOCK_PORT: 8000  # pinned: the published mapping above targets 8000
    volumes:
      - *config-volume
    depends_on:
      postgres: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "python", "-m", "newsdock_api.adapters.healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
  agent:
    build:
      context: ..
      dockerfile: apps/agent/Dockerfile
    image: newsdock-agent:dev
    profiles: [apps]
    restart: unless-stopped
    networks: [agent]  # no route to postgres or kafka (AC-13)
    environment:  # the agent's env surface (TC-35) plus the config-file path
      <<: *config-file
      MCP_URL: http://api:8000/mcp
      OLLAMA_URL: http://host.docker.internal:11434
    volumes:
      - agent_state:/data
      - *config-volume
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-m", "newsdock_agent.adapters.healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    image: newsdock-web:dev
    profiles: [apps]
    restart: unless-stopped
    networks: [agent]
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"  # container port fixed; host port from .env
    environment:
      <<: *config-file
    volumes:
      - *config-volume
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:'+process.env.PORT).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

networks:
  data: {}
  agent: {}

volumes:
  pgdata:
  agent_state:
