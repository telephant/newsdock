[project]
name = "newsdock-ingester"
version = "0.0.0"
description = "newsdock ingester app"
requires-python = ">=3.12"
dependencies = [
    "newsdock-config",
    "newsdock-core",
    "newsdock-db",
    "pydantic-settings>=2.15",
    "confluent-kafka>=2.15",
    "httpx>=0.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/newsdock_ingester"]

[tool.uv.sources]
newsdock-config = { workspace = true }
newsdock-core = { workspace = true }
newsdock-db = { workspace = true }
