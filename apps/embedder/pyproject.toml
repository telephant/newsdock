[project]
name = "newsdock-embedder"
version = "0.0.0"
description = "newsdock embedder app"
requires-python = ">=3.12"
dependencies = [
    "newsdock-config",
    "newsdock-db",
    "newsdock-embedding",
    "pydantic-settings>=2.15",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/newsdock_embedder"]

[tool.uv.sources]
newsdock-config = { workspace = true }
newsdock-db = { workspace = true }
newsdock-embedding = { workspace = true }
