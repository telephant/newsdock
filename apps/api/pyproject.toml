[project]
name = "newsdock-api"
version = "0.0.0"
description = "newsdock api app"
requires-python = ">=3.12"
dependencies = [
    "newsdock-config",
    "newsdock-core",
    "newsdock-db",
    "pydantic-settings>=2.15",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "mcp>=2.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/newsdock_api"]

[tool.uv.sources]
newsdock-config = { workspace = true }
newsdock-core = { workspace = true }
newsdock-db = { workspace = true }
