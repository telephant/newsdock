[project]
name = "newsdock-api"
version = "0.0.0"
description = "newsdock api app"
requires-python = ">=3.12"
dependencies = ["newsdock-core", "pydantic-settings>=2.15"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/newsdock_api"]

[tool.uv.sources]
newsdock-core = { workspace = true }
