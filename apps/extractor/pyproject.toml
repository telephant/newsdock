[project]
name = "newsdock-extractor"
version = "0.0.0"
description = "newsdock extractor app"
requires-python = ">=3.12"
dependencies = [
    "newsdock-config",
    "newsdock-db",
    "pydantic-settings>=2.15",
    "httpx>=0.28",
    "trafilatura>=2.3",
    "protego>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/newsdock_extractor"]

[tool.uv.sources]
newsdock-config = { workspace = true }
newsdock-db = { workspace = true }
