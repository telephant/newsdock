[project]
name = "newsdock-agent"
version = "0.0.0"
description = "newsdock agent app"
requires-python = ">=3.12"
dependencies = [
    "newsdock-config",
    "newsdock-core",
    "pydantic-settings>=2.15",
    "mcp>=2.3",
    "httpx>=0.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/newsdock_agent"]

[tool.uv.sources]
newsdock-config = { workspace = true }
newsdock-core = { workspace = true }
