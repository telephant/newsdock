[project]
name = "newsdock-processor"
version = "0.0.0"
description = "newsdock processor app"
requires-python = ">=3.12"
dependencies = [
    "newsdock-core",
    "pydantic-settings>=2.15",
    "confluent-kafka>=2.15",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/newsdock_processor"]

[tool.uv.sources]
newsdock-core = { workspace = true }
